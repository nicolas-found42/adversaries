[build]
target = "index.html"
dist = "dist"

[watch]
ignore = ["reports", "dist", "target", ".git", ".venv", "__pycache__", ".ruff_cache", ".pytest_cache", ".council-cache", ".council-context", ".codelimit_cache", ".import_linter_cache", ".ty_cache", ".mypy_cache"]

[serve]
addresses = ["127.0.0.1"]
port = 8080
open = true

# The browser build talks to the council-bridge sidecar on :8787; the proxy
# makes /api/* same-origin in dev so no CORS handling is needed. (Trunk 0.22
# forbids root-mounted proxies: scope the rewrite to /api and strip it.)
[[proxy]]
backend = "http://127.0.0.1:8787/api"
rewrite = "/api"
