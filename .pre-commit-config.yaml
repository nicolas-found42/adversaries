repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --exit-non-zero-on-fix
        language: system
        types: [python]
        pass_filenames: true

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        pass_filenames: true

      - id: ty
        name: ty (type check)
        entry: uv run ty check
        language: system
        pass_filenames: false
        always_run: true

      - id: codelimit
        name: codelimit (function length)
        entry: uv run codelimit check
        language: system
        types: [python]
        pass_filenames: true
