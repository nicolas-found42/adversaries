name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Gates · tests · smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-extras


      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Runs the same hooks as local pre-commit, so the flags live in exactly one
      # place: .pre-commit-config.yaml. A hook that rewrites a file fails the run.
      - name: Quality gates
        run: uv run pre-commit run --all-files

      # Advisory: reports complexity but never fails the build.
      - name: Complexity report (radon + xenon)
        continue-on-error: true
        run: |
          uv run radon cc -s -a .
          uv run xenon --max-absolute B --max-modules B --max-average A .

      - name: Smoke test (dry run)
        run: uv run council.py --dry-run "CI smoke test question"
