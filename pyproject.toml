[project]
name = "adversaries"
version = "0.1.0"
description = "Adversarial Council — executive decision support via a cross-model red-team chain (Mistral → OpenRouter → Ollama Cloud → OpenCode Go)."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "openai>=1.50",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Optional document readers used by `council.py --context` for pdf/docx/xlsx,
# plus markdown for the HTML report copy.
docs = [
    "markdown>=3.0",
    "openpyxl>=3.0",
    "pypdf>=4.0",
    "python-docx>=1.0",
]

[dependency-groups]
dev = [
    "codelimit",
    "import-linter>=2.15",
    "lizard>=1.24.2",
    "pre-commit",
    "pytest>=8",
    "radon[toml]>=6.0.1",
    "ruff",
    "ty",
    "xenon>=0.9.3",
]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = [
    "E4",  # pycodestyle errors (subset: real errors only)
    "E7",
    "E9",
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "N",   # pep8-naming
    "ISC", # flake8-implicit-str-concat
    "RUF", # ruff-specific rules
    "S",   # flake8-bandit (security)
    "EXE", # flake8-executable
]

[tool.pyright]
# Without this, pyright falls back to the system interpreter and cannot resolve
# the project's dependencies. ty reads .venv automatically; pyright needs it said.
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"

[tool.basedpyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"

[tool.radon]
exclude = "**/.venv/**,**/__pycache__/**,**/build/**,**/dist/**"
show_complexity = true
average = true
total_average = true

[tool.importlinter]
# import-linter can only lint packages (directories), not a top-level module, so
# the graph is rooted at `scripts/`. The application module is pulled in as an
# external package purely so tooling is forbidden from importing it.
root_packages = ["scripts"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Repository tooling must not import the application"
type = "forbidden"
source_modules = ["scripts.check_function_length"]
forbidden_modules = ["council"]

[tool.pytest.ini_options]
# The app is a flat module (council.py), not a package; pytest's importlib mode
# needs the repo root on sys.path to import it.
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# pytest's assertion rewriting makes `assert` the correct idiom in tests.
"tests/**" = ["S101"]
