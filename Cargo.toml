[package]
name = "council-ui"
version = "0.2.0"
edition = "2024"
description = "Unified egui UI for Adversarial Council: one Rust GUI running natively and in the browser via a live-reload web dev server"
readme = "README.md"
license = "MIT"
default-run = "council-ui"

[lib]
name = "council_ui"
path = "src/lib.rs"

[[bin]]
name = "council-ui"
path = "src/main.rs"

[[bin]]
name = "council-bridge"
path = "src/bin/council-bridge.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "glow",
    "default_fonts",
    "accesskit",
    "clipboard",
    "links",
    "wayland",
    "x11",
] }
egui = "0.37"
egui_extras = "0.37"
ehttp = { version = "0.7.2", features = ["streaming"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = [
    "clock",
    "std",
    "serde",
] }
egui_commonmark = { version = "0.26", default-features = false, features = ["pulldown_cmark"] }
web-time = "1"
rfd = "0.16"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "io-util",
    "sync",
] }
axum = "0.8"
tower-http = { version = "0.7", features = ["fs"] }
tokio-stream = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
log = "0.4"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "HtmlCanvasElement",
    "Window",
    "Document",
    "Element",
] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
similar_names = "allow"
too_many_lines = "allow"
uninlined_format_args = "allow"
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
struct_excessive_bools = "allow"
match_same_arms = "allow"
unnested_or_patterns = "allow"
collapsible_if = "allow"
collapsible_match = "allow"
assigning_clones = "allow"
assert_is_empty = "allow"
needless_pass_by_value = "allow"
